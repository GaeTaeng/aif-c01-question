<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>AWS AI Practitioner 문제 연습장</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero is-hidden" id="hero">
        <p class="hero__eyebrow">AWS AI Practitioner</p>
        <h1>문제 연습장</h1>
        <p class="hero__copy">
          모바일에서 빠르게 문제를 풀고, 정답 이유와 오답 포인트를 바로 확인할 수
          있게 구성했습니다.
        </p>
        <div class="hero__stats" id="hero-stats"></div>
        <div class="hero__actions">
          <div class="start-mode-group" aria-label="시작 방식 선택">
            <a class="primary-button primary-link hero__start-button" href="../question/?order=random">
              랜덤 시작
            </a>
            <a class="secondary-button primary-link hero__start-button" href="../question/?order=sequence">
              순서대로 시작
            </a>
            <a class="secondary-button primary-link hero__start-button" href="../question/?order=reverse">
              역순 시작
            </a>
          </div>
          <button
            class="secondary-button hero__reset-button"
            id="reset-progress-button"
            data-reset-progress="true"
            type="button"
          >
            처음부터 다시 풀기
          </button>
          <p class="hero__hint">
            시작하면 랜딩 영역은 사라지고 문제 화면만 표시됩니다.
          </p>
        </div>
      </header>

      <main class="main-content" id="main-content">
        <section class="panel panel--quiz is-active" id="quiz-panel">
          <div class="panel__toolbar">
            <div class="segmented" role="tablist" aria-label="문제 모드">
              <button class="segmented__button is-active" data-mode="random" type="button">
                문제 풀이
              </button>
              <button class="segmented__button" data-mode="wrong" type="button">
                오답 다시 풀기
              </button>
              <button class="segmented__button" data-mode="glossary" type="button">
                용어정리 모음
              </button>
            </div>
          </div>

          <section class="quiz-view" id="quiz-view">
            <div class="quiz-meta">
              <div class="quiz-meta__badges">
                <span class="pill" id="mode-badge">문제 풀이</span>
                <span class="pill pill--muted" id="question-id">Q 1</span>
              </div>
              <button class="ghost-button quiz-meta__list-button" id="open-question-sheet-button" type="button">
                문제 풀이 현황
              </button>
            </div>
            <div class="quiz-progress" id="quiz-progress">
              <span class="pill pill--progress" id="progress-completed">완료 0문제</span>
              <span class="pill pill--success pill--progress" id="progress-correct">정답 0문제</span>
              <span class="pill pill--muted pill--progress" id="progress-remaining">남음 409문제</span>
              <span class="pill pill--danger pill--progress" id="progress-wrong">오답 0문제</span>
            </div>

            <article class="question-card" id="question-card">
              <div class="question-card__header">
                <h2 id="question-title">문제를 불러오는 중입니다.</h2>
              </div>
              <p class="question-card__subtitle" id="question-subtitle">
                단일 선택, 복수 선택, 매칭형, 순서형 문제를 제공합니다.
              </p>
              <div class="question-card__body">
                <p class="question-card__prompt" id="question-prompt"></p>
                <p class="question-card__prompt question-card__prompt--english is-hidden" id="question-prompt-english"></p>
              </div>
            </article>

            <form class="options" id="options-form"></form>

            <div class="action-row">
              <button class="primary-button" id="check-answer-button" type="button" disabled>
                정답 확인
              </button>
            </div>

            <section class="feedback-card is-hidden" id="feedback-card"></section>

            <section class="wrong-note is-hidden" id="wrong-note-summary">
              <div class="wrong-note__header">
                <h3>오답 노트</h3>
                <div class="wrong-note__actions">
                  <button class="ghost-button" id="remove-current-wrong-button" type="button">
                    현재 문제 제거
                  </button>
                  <button class="ghost-button" id="clear-wrong-button" type="button">
                    초기화
                  </button>
                </div>
              </div>
              <div id="wrong-note-list"></div>
            </section>
          </section>

          <section class="glossary-view is-hidden" id="glossary-view">
            <div class="glossary-toolbar">
              <label class="search-field">
                <span>검색</span>
                <input
                  id="glossary-search"
                  type="search"
                  placeholder="예: RAG, Bedrock, Temperature"
                />
              </label>
            </div>
            <div class="glossary-grid" id="glossary-grid"></div>
          </section>
        </section>

        <div class="floating-actions">
          <a class="ghost-button ghost-button--floating ghost-button--floating-secondary primary-link" href="../">
            홈
          </a>
          <button class="ghost-button ghost-button--floating" id="next-question-button" type="button">
            다음
          </button>
        </div>
      </main>

      <div class="sheet-backdrop is-hidden" id="question-sheet-backdrop"></div>
      <section class="question-sheet is-hidden" id="question-sheet" aria-hidden="true">
        <div class="question-sheet__grabber"></div>
        <div class="question-sheet__header">
          <div>
            <p class="question-sheet__eyebrow">문제 목록</p>
            <h2>전체 진행 현황</h2>
          </div>
          <button class="ghost-button" id="close-question-sheet-button" type="button">
            닫기
          </button>
        </div>
        <div class="question-status-summary" id="question-status-summary-sheet"></div>
        <div class="question-palette" id="question-palette-sheet"></div>
      </section>
    </div>

    <script src="../questions.js"></script>
    <script src="../app.js"></script>
  </body>
</html>
